services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dwco
      POSTGRES_USER: dwco
      POSTGRES_PASSWORD: dwco
    ports:
      - "5432:5432"
    volumes:
      - dwco_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  dwco_postgres:
