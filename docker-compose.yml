services:
  governance-web:
    build: ./governance-web
    ports:
      - "127.0.0.1:${DWCO_GOVERNANCE_PORT:-3100}:8080"
    depends_on:
      governance-data:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - governance_ingress
      - governance_data_plane

  governance-data:
    build: ./governance-data
    environment:
      DWCO_GOVERNANCE_EVIDENCE_ROOT: /evidence
      DWCO_LOCAL_CI_RECEIPT: /local-ci/latest.json
    volumes:
      - ./PROJECT_STATUS.md:/evidence/PROJECT_STATUS.md:ro
      - ./MASTER_PROJECT_PLAN.md:/evidence/MASTER_PROJECT_PLAN.md:ro
      - ./DEPENDENCY_REGISTER.md:/evidence/DEPENDENCY_REGISTER.md:ro
      - ./docs/reviews:/evidence/reviews:ro
      - ./.local-ci:/local-ci:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - governance_data_plane
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DWCO_DATABASE_URL: postgresql+psycopg://dwco:dwco@postgres:5432/dwco
      DWCO_REDIS_URL: redis://redis:6379/0
      DWCO_JWT_SECRET: local-compose-secret-change-before-any-shared-use
    ports:
      - "${DWCO_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dwco
      POSTGRES_USER: dwco
      POSTGRES_PASSWORD: dwco
    ports:
      - "${DWCO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - dwco_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwco -d dwco"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${DWCO_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dwco_postgres:

networks:
  governance_ingress:
  governance_data_plane:
    internal: true
